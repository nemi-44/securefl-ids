name: SecureFL-IDS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip==24.2
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          OMP_NUM_THREADS: "1"
          PYTHONPATH: "."
        run: |
          python -m pytest -q tests

      - name: Run result and artefact verification suite (854 checks)
        run: |
          python scripts/verify.py

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform format and validation check
        run: |
          terraform -chdir=terraform fmt -check
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate

      - name: Verify live AWS S3 parameter bus and CloudWatch log group
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          python - << 'PY'
          import os, boto3
          region = os.environ.get("AWS_DEFAULT_REGION") or "eu-west-1"
          sts = boto3.client("sts", region_name=region)
          ident = sts.get_caller_identity()
          print(f"Verified AWS identity in account: {ident['Account']}")
          s3 = boto3.client("s3", region_name=region)
          bucket = "securefl-ids-bus-a27582b3"
          objs = s3.list_objects_v2(Bucket=bucket, Prefix="results/")
          count = objs.get("KeyCount", 0)
          assert count >= 18, f"Expected >= 18 cloud results in s3://{bucket}/results/, found {count}"
          print(f"Verified S3 parameter bus s3://{bucket}/results/ ({count} result objects)")
          logs = boto3.client("logs", region_name=region)
          groups = logs.describe_log_groups(logGroupNamePrefix="/securefl-ids/runs").get("logGroups", [])
          assert any(g["logGroupName"] == "/securefl-ids/runs" for g in groups), "CloudWatch log group /securefl-ids/runs not found"
          print("Verified CloudWatch log group /securefl-ids/runs")
          PY
